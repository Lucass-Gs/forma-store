name: forma-store
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: forma_store
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
    volumes: ["data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d forma_store"]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    build: { context: ., target: api }
    command: ["node", "dist/migrate.js"]
    environment: &api-env
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-local-demo-only}@db:5432/forma_store
      PUBLIC_ORIGIN: http://localhost:${PORT:-4102}
      SQS_ENDPOINT: http://queue:9324
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo1234!}
    depends_on:
      db: { condition: service_healthy }
  seed:
    build: { context: ., target: api }
    command: ["node", "dist/seed.js"]
    environment: *api-env
    profiles: ["tools"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  api:
    build: { context: ., target: api }
    environment: *api-env
    init: true
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: Dockerfile.web }
    ports: ["127.0.0.1:${PORT:-4102}:3000"]
    depends_on:
      api: { condition: service_healthy }
  queue:
    image: softwaremill/elasticmq-native:1.6.15
  worker:
    build: { context: ., target: api }
    command: ["node", "dist/worker.js"]
    environment: *api-env
    healthcheck: { disable: true }
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      queue: { condition: service_started }
  tests:
    build: { context: ., target: test }
    environment:
      BASE_URL: http://web:3000
    profiles: ["test"]
    depends_on:
      web: { condition: service_healthy }
volumes:
  data:
